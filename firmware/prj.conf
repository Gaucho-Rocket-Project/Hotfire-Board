# GPIO
CONFIG_GPIO=y

# C++17
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# State Machine Framework
CONFIG_SMF=y

# UART Drivers
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Native USB CDC ACM
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# Avoid recursive driver logging through the USB CDC shell backend.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# Zephyr Shell over USB CDC
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PROMPT_UART="daq:~$ "

# Logging through the shell
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y

# Avoid competing console backends
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Optional diagnostics
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_DEVICE_SHELL=y

# Kernel
CONFIG_MAIN_STACK_SIZE=2048

# Disk access and STM32 SDMMC
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STM32=y

# File system
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Never automatically format the card
CONFIG_FS_FATFS_MOUNT_MKFS=n

# File system commands over Zephyr Shell
CONFIG_FILE_SYSTEM_SHELL=y

# MAX31856 thermocouple amplifiers
CONFIG_SPI=y
