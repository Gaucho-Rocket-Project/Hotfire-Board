# GPIO
CONFIG_GPIO=y

# C++17
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# State Machine Framework
CONFIG_SMF=y

# UART Drivers
CONFIG_SERIAL=y
# USB CDC shell uses the interrupt API; USART1 exclusively uses async DMA.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y
CONFIG_UART_LINE_CTRL=y

# Native USB CDC ACM
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# Avoid recursive driver logging through the USB CDC shell backend.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# Zephyr Shell over USB CDC
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PROMPT_UART="daq:~$ "

# Logging through the shell
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y

# Avoid competing console backends
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Optional diagnostics
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_HWINFO=y
CONFIG_DEVICE_SHELL=y

# RTC calendar and shell commands (set the clock in UTC)
CONFIG_RTC=y
CONFIG_RTC_SHELL=y
CONFIG_ENTROPY_GENERATOR=y

# Kernel
# Main owns the RTC command parser; UART DMA buffers have static lifetime.
CONFIG_MAIN_STACK_SIZE=4096
# Keep UART/heartbeat/USB work preemptible by the 1 kHz pressure worker (priority 1).
CONFIG_MAIN_THREAD_PRIORITY=3
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=4
# UART DMA setup/recovery now runs through the system workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_REBOOT=y

# Disk access and STM32 SDMMC
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STM32=y

# File system
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_HAS_RTC=y
# Timestamped session directories exceed FAT's 8.3 filename limit.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_REENTRANT=y

# Never automatically format the card
CONFIG_FS_FATFS_MOUNT_MKFS=n

# File system commands over Zephyr Shell
CONFIG_FILE_SYSTEM_SHELL=y

# MAX31856 thermocouple amplifiers
CONFIG_SPI=y
CONFIG_SPI_STM32_DMA=y

# Four 4-20 mA pressure inputs on ADC1, PC0..PC3.
CONFIG_ADC=y
CONFIG_ADC_STM32_VREFINT_CALIBRATE=y
